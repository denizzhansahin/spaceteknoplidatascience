[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "st-ds"
version = "0.1.0"
description = "SpaceTeknopoliDataScience (STDS): Standalone Soil Carbon Analytics, Chemometrics, Sensor Fusion, Uncertainty, XAI and Carbon Stock Engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - SpaceTeknopoliDataScience"}
authors = [
    {name = "SpaceTeknopoliDataScience Team"}
]
dependencies = [
    "numpy>=1.26.0,<3.0",
    "scipy>=1.11.0,<2.0",
    "torch>=2.2.0,<3.0",
    "scikit-learn>=1.4.0,<2.0",
    "pandas>=2.1.0,<3.0",
    "pydantic>=2.5.0,<3.0",
    "safetensors>=0.5.3,<1.0",
    "matplotlib>=3.8.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "wheel>=0.45.0,<1.0",
]
viz = [
    "plotly>=5.20.0,<6.0",
    "seaborn>=0.13.0,<1.0",
]

[project.scripts]
st-ds = "st_ds.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["st_ds*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
